      <text x="0" y="5" font-family="'Newsreader', serif" font-size="18" fill="#F3EFEA" text-anchor="middle">Hydra Core</text>

      <!-- Satellite Node Disks -->
      <circle cx="-140" cy="-60" r="22" fill="#24211d" stroke="#F3EFEA" stroke-opacity="0.4"/>
      <text x="-140" y="-56" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#F3EFEA" text-anchor="middle">US-E</text>

      <circle cx="140" cy="-60" r="22" fill="#24211d" stroke="#F3EFEA" stroke-opacity="0.4"/>
      <text x="140" y="-56" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#F3EFEA" text-anchor="middle">EU-W</text>

      <circle cx="170" cy="120" r="22" fill="#24211d" stroke="#F3EFEA" stroke-opacity="0.4"/>
      <text x="170" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#F3EFEA" text-anchor="middle">AP-S</text>

      <circle cx="-160" cy="110" r="22" fill="#24211d" stroke="#F3EFEA" stroke-opacity="0.4"/>
