<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="tokenBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24221f"/>
      <stop offset="70%" stop-color="#171614"/>
      <stop offset="100%" stop-color="#121110"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#tokenBg)"/>

  <!-- Top Metadata -->
  <text x="160" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#787167" letter-spacing="3">SECURITY CAPSTONE 03 // ROLE-BASED ACCESS &amp; CRYPTOGRAPHIC STORAGE</text>
  <text x="1440" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#D4B08C" text-anchor="end" letter-spacing="2">JAVA // AES-GCM // AUDIT LOG</text>

  <!-- Central Layout Container -->
  <g transform="translate(160, 160)">
    <rect width="1280" height="660" fill="#181715" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" rx="8"/>

    <!-- Left: Cryptographic Security Model -->
    <g transform="translate(80, 80)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#787167" letter-spacing="2">ACCESS CONTROL &amp; ENCRYPTION ARCHITECTURE</text>

      <g transform="translate(0, 30)">
        <rect width="260" height="110" fill="#1e1c19" stroke="#ffffff" stroke-opacity="0.08" rx="6"/>
        <text x="24" y="38" font-family="'Newsreader', serif" font-size="18" fill="#F3EFEA">PBKDF2 Key Derivation</text>
        <text x="24" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#B3ABA0">600,000 Iterations + Salt</text>
        <text x="24" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D4B08C">Protection against brute-force</text>
      </g>

      <g transform="translate(290, 30)">
        <rect width="260" height="110" fill="#1e1c19" stroke="#ffffff" stroke-opacity="0.08" rx="6"/>
        <text x="24" y="38" font-family="'Newsreader', serif" font-size="18" fill="#F3EFEA">AES-256-GCM Vault</text>
        <text x="24" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#B3ABA0">Authenticated Encryption</text>
        <text x="24" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D4B08C">Ciphertext tamper detection</text>
      </g>

      <g transform="translate(580, 30)">
        <rect width="260" height="110" fill="#1e1c19" stroke="#ffffff" stroke-opacity="0.08" rx="6"/>
        <text x="24" y="38" font-family="'Newsreader', serif" font-size="18" fill="#F3EFEA">Role-Based Access (RBAC)</text>
        <text x="24" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#B3ABA0">Granular User Privilege</text>
        <text x="24" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D4B08C">Admin, Auditor, Operator</text>
      </g>
    </g>

    <!-- Audit Log Stream -->
    <g transform="translate(80, 270)">
      <line x1="0" y1="0" x2="1120" y2="0" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#787167" letter-spacing="2">IMMUTABLE SECURITY AUDIT STREAM</text>

      <g font-family="'JetBrains Mono', monospace" font-size="12" transform="translate(0, 60)">
        <text y="0" fill="#787167">[21:40:01] AUTH_SUCCESS: Session token generated for UID #4019 (256-bit entropy)</text>
        <text y="26" fill="#D4B08C">[21:40:02] VAULT_UNLOCK: Ciphertext payload decrypted with verified GMAC tag</text>
        <text y="52" fill="#F3EFEA">[21:40:03] RBAC_AUDIT: Privilege scope verified :: Read access granted</text>
        <text y="78" fill="#787167">[21:40:04] KEY_ROTATION: Ephemeral master key purged from process memory heap</text>
      </g>
    </g>

    <g transform="translate(80, 560)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#787167" letter-spacing="1.5">CRYPTOGRAPHIC STANDARD</text>
      <text x="0" y="24" font-family="'Newsreader', serif" font-size="22" fill="#F3EFEA">AES-256 GCM + PBKDF2</text>

      <text x="440" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#787167" letter-spacing="1.5">INTEGRITY GUARANTEE</text>
      <text x="440" y="24" font-family="'Newsreader', serif" font-size="22" fill="#D4B08C">Zero Plaintext Persistence</text>

      <text x="840" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#787167" letter-spacing="1.5">CORE RUNTIME</text>
      <text x="840" y="24" font-family="'Newsreader', serif" font-size="22" fill="#F3EFEA">Java &amp; Java Cryptography Ext</text>
    </g>
  </g>

  <text x="160" y="930" font-family="'Newsreader', serif" font-size="18" font-style="italic" fill="#B3ABA0">Secure credential vault engineering role-based access control and persistent encrypted storage.</text>
</svg>
