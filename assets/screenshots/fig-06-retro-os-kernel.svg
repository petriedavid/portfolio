<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="kernelGradWarm" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#262320"/>
      <stop offset="65%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#121110"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#kernelGradWarm)"/>

  <!-- Top Metadata -->
  <text x="160" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#787167" letter-spacing="3">COMPUTING HARDWARE STUDY 06 // RISC-V VIRTUAL MACHINE</text>
  <text x="1440" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#D4B08C" text-anchor="end" letter-spacing="2">RV32I BARE METAL</text>

  <!-- Central Card -->
  <g transform="translate(160, 160)">
    <rect width="1280" height="660" fill="#181715" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" rx="8"/>

    <!-- Left Code / Disassembly Stream -->
    <g transform="translate(80, 80)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#787167" letter-spacing="2">DISASSEMBLY STREAM @ PC 0x8000_014C</text>

      <g font-family="'JetBrains Mono', monospace" font-size="13" transform="translate(0, 35)">
        <text y="0" fill="#787167">0x80000138:  13 05 00 00       addi    a0, zero, 0</text>
        <text y="28" fill="#787167">0x8000013C:  93 05 10 00       addi    a1, zero, 1</text>
        <text y="56" fill="#787167">0x80000140:  ef 00 80 00       jal     ra, 0x80000148</text>
        <text y="84" fill="#D4B08C">&gt;&gt; 0x80000148:  03 26 05 00       lw      a2, 0(a0)</text>
        <text y="112" fill="#F3EFEA">&gt;&gt; 0x8000014C:  33 06 c5 00       add     a2, a2, a1  ; CURRENT_EXEC</text>
        <text y="140" fill="#B3ABA0">   0x80000150:  23 20 c5 00       sw      a2, 0(a0)</text>
        <text y="168" fill="#787167">   0x80000154:  63 1a b6 00       bne     a2, a1, 0x80000164</text>
        <text y="196" fill="#787167">   0x80000158:  93 06 40 00       addi    a3, zero, 4</text>
      </g>
    </g>

    <!-- Right: Memory Paging Architecture -->
    <g transform="translate(720, 80)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#787167" letter-spacing="2">SV32 VIRTUAL MMU PAGES</text>

      <g transform="translate(0, 35)">
        <rect width="480" height="42" fill="#1e1c19" stroke="#ffffff" stroke-opacity="0.06" rx="4"/>
        <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F3EFEA">0x0000..0x0FFF : KERNEL BSS &amp; STACK (RW-)</text>

        <rect y="56" width="480" height="42" fill="#24211d" stroke="#D4B08C" stroke-opacity="0.3" rx="4"/>
        <text x="20" y="82" font-family="'JetBrains Mono', monospace" font-size="12" fill="#D4B08C">0x1000..0x7FFF : KERNEL TEXT CODE (R-X)</text>

        <rect y="112" width="480" height="42" fill="#1e1c19" stroke="#ffffff" stroke-opacity="0.06" rx="4"/>
        <text x="20" y="138" font-family="'JetBrains Mono', monospace" font-size="12" fill="#B3ABA0">0x8000..0xFFFF : HEAP SEGMENT &amp; MMIO (RW-)</text>
      </g>
    </g>

    <g transform="translate(80, 560)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#787167" letter-spacing="1.5">VIRTUAL FREQUENCY</text>
      <text x="0" y="24" font-family="'Newsreader', serif" font-size="24" fill="#F3EFEA">50.0 MHz Clock</text>

      <text x="400" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#787167" letter-spacing="1.5">TLB HIT RATE</text>
      <text x="400" y="24" font-family="'Newsreader', serif" font-size="24" fill="#D4B08C">99.4% Efficiency</text>

      <text x="800" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#787167" letter-spacing="1.5">MEMORY FOOTPRINT</text>
      <text x="800" y="24" font-family="'Newsreader', serif" font-size="24" fill="#F3EFEA">16MB Flat Array</text>
    </g>
  </g>

  <text x="160" y="930" font-family="'Newsreader', serif" font-size="18" font-style="italic" fill="#B3ABA0">A bespoke RISC-V interpreter designed with quiet elegance and transparent introspection.</text>
</svg>
