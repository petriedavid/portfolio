<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#222222"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#000000"/>
  <rect width="1600" height="900" fill="url(#dotGrid1)"/>

  <!-- Outer Glass Frame: #111111 with 1px #222222 border -->
  <rect x="40" y="40" width="1520" height="820" fill="#111111" stroke="#222222" stroke-width="1.5" rx="8"/>

  <!-- Top Terminal Bar -->
  <rect x="40" y="40" width="1520" height="50" fill="#0C0C0C" stroke="#222222" stroke-width="1" rx="8"/>
  <circle cx="72" cy="65" r="5.5" fill="#222222"/>
  <circle cx="94" cy="65" r="5.5" fill="#222222"/>
  <circle cx="116" cy="65" r="5.5" fill="#222222"/>
  
  <text x="150" y="70" font-family="'Geist Mono', monospace" font-size="13" fill="#888888">PIXELLABZ // DECENTRALIZED RPC MESH ARCHITECTURE</text>
  <text x="1500" y="70" font-family="'Geist Mono', monospace" font-size="12" fill="#3B82F6" text-anchor="end">SOLANA &amp; APTOS // 8M+ TRANSACTIONS</text>

  <!-- Network Diagram -->
  <g transform="translate(100, 140)">
    <!-- Central Coordinator Node -->
    <circle cx="700" cy="330" r="70" fill="#161616" stroke="#3B82F6" stroke-width="2"/>
    <text x="700" y="325" font-family="'Geist Mono', monospace" font-size="15" fill="#EDEDED" text-anchor="middle" font-weight="700">CORE MESH</text>
    <text x="700" y="348" font-family="'Geist Mono', monospace" font-size="11" fill="#3B82F6" text-anchor="middle">99.99% UPTIME</text>

    <!-- Peripheral Nodes -->
    <!-- US -->
    <line x1="700" y1="330" x2="300" y2="170" stroke="#222222" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="300" cy="170" r="45" fill="#141414" stroke="#333333" stroke-width="1.5"/>
    <text x="300" y="168" font-family="'Geist Mono', monospace" font-size="12" fill="#EDEDED" text-anchor="middle">US-EAST</text>
    <text x="300" y="186" font-family="'Geist Mono', monospace" font-size="10" fill="#888888" text-anchor="middle">5 Bare-Metal</text>

    <!-- Germany -->
    <line x1="700" y1="330" x2="1100" y2="170" stroke="#222222" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="1100" cy="170" r="45" fill="#141414" stroke="#333333" stroke-width="1.5"/>
    <text x="1100" y="168" font-family="'Geist Mono', monospace" font-size="12" fill="#EDEDED" text-anchor="middle">EU-CENTRAL</text>
    <text x="1100" y="186" font-family="'Geist Mono', monospace" font-size="10" fill="#888888" text-anchor="middle">Germany / 6 Nodes</text>

    <!-- Singapore -->
    <line x1="700" y1="330" x2="700" y2="530" stroke="#222222" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="700" cy="530" r="45" fill="#141414" stroke="#333333" stroke-width="1.5"/>
    <text x="700" y="528" font-family="'Geist Mono', monospace" font-size="12" fill="#EDEDED" text-anchor="middle">AP-SOUTH</text>
    <text x="700" y="546" font-family="'Geist Mono', monospace" font-size="10" fill="#888888" text-anchor="middle">Singapore / 4 Nodes</text>

    <!-- Telemetry Badges -->
    <g transform="translate(60, 560)">
      <rect width="260" height="60" fill="#0C0C0C" stroke="#222222" rx="4"/>
      <text x="20" y="26" font-family="'Geist Mono', monospace" font-size="11" fill="#888888">TOTAL REVENUE</text>
      <text x="20" y="48" font-family="'Geist Mono', monospace" font-size="17" fill="#3B82F6" font-weight="700">~$180,000 USD</text>
    </g>

    <g transform="translate(1080, 560)">
      <rect width="260" height="60" fill="#0C0C0C" stroke="#222222" rx="4"/>
      <text x="20" y="26" font-family="'Geist Mono', monospace" font-size="11" fill="#888888">ACTIVE USERS</text>
      <text x="20" y="48" font-family="'Geist Mono', monospace" font-size="17" fill="#EDEDED" font-weight="700">4,000+ GLOBAL</text>
    </g>
  </g>
</svg>
