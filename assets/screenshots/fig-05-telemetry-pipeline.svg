      <stop offset="0%" stop-color="#282522"/>
      <stop offset="65%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#121110"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#netGradWarm)"/>

  <!-- Top Metadata -->
